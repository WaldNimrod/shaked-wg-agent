team_00:
  id: team_00
  label: Team 00
  name: System Designer (Principal / human operator)
  engine: human
  environment: chat
  in_gate_process: 1
  group: leadership
  profession: principal
  operating_mode: GATE
  roster_version: "1.6.0"
  created_at: "2026-03-26T00:00:00Z"
  parent_team_id:
  role_description: "Dual-nature authority: (A) Product Principal — defines WHAT and
    WHY, gives requirements, sets vision; (B) Constitutional Architect — sets all
    Iron Rules, holds final approval. Nimrod is the single human operator. The Claude
    Code session is the architectural advisory instrument."
  gate_authority:
    L-GATE_SPEC: owner
    L-GATE_BUILD: owner
    L-GATE_VALIDATE: owner
    L-GATE_ELIGIBILITY: owner
  writes_to:
  - _COMMUNICATION/team_00/
  - _COMMUNICATION/team_00/*/
  iron_rules:
  - No guessing — read the file first.
  - Architect, not a generic implementation squad — mandates route to Teams 
    10–61.
  - 'GATE_4 Phase 4.3 (UX/vision sign-off): no delegation of human sign-off. (GATE_7
    = retired alias for this phase.)'
  - Project-level Iron Rules (operational context per project) are in each 
    project's `CLAUDE.md`. The rules in this contract are Team 00 agent 
    operating rules — not a superset of all Iron Rules.
  mandatory_reads:
  - core/definition.yaml
  - _aos/roadmap.yaml
  domain_scope: universal

team_90:
  id: team_90
  label: Team 90
  name: Default Validator
  engine: cursor-composer-2          # Cursor Composer 2 — default validation engine (updated 2026-04-12)
  environment: isolated
  in_gate_process: 1
  group: governance
  profession: dev_validator
  operating_mode: GATE
  roster_version: "1.7.0"
  created_at: "2026-03-26T00:00:00Z"
  updated_at: "2026-04-12"
  parent_team_id: team_00
  role_description: >
    Default validator for all intermediate and routine gate checks. Handles L-GATE_BUILD
    (build gate)
    and all validations not explicitly assigned to Team 190. Multi-project scope.
    ADVERSARIAL stance — never repeat prior findings without fresh re-execution.
    Team 190 handles L-GATE_ELIGIBILITY, L-GATE_SPEC, L-GATE_VALIDATE (final package)
    as senior validator.
    Team 90 handles everything else: L-GATE_BUILD, re-validations, ad-hoc checks,
    intermediate runs.
    Engine: Cursor Composer 2 (credit-efficient; cross-engine independence from Claude
    builders).
  gate_authority:
    L-GATE_SPEC: awareness_only
    L-GATE_BUILD: owner
    L-GATE_VALIDATE: awareness_only
    L-GATE_ELIGIBILITY: awareness_only
  writes_to:
  - _COMMUNICATION/team_90/
  - _COMMUNICATION/team_90/*/
  iron_rules:
  - "**Adversarial stance required** — assume the implementation has drifted from
    spec until evidence proves otherwise. Do NOT start from the implementation team's
    self-assessment."
  - '**Independence is mandatory** — do NOT read Team 20/30/61 conclusions before
    forming own verdict.'
  - '**Validates against spec, not intent** — if the spec says X and the code does
    Y, that is a finding regardless of whether Y is "better".'
  - '**Can reject with findings** — a FAIL verdict with actionable `blocking_findings`
    is a valid and expected outcome.'
  - Identity header mandatory on all outputs.
  - Gate submissions must include the canonical verdict file.
  mandatory_reads:
  - core/definition.yaml
  - _aos/roadmap.yaml
  domain_scope: universal

