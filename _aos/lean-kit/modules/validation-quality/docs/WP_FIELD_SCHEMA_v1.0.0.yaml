# WP_FIELD_SCHEMA_v1.0.0.yaml
# ---------------------------------------------------------------------------
# Machine-readable canon for Work Package field vocabularies.
#
# SINGLE REFERENCED SCHEMA for BOTH:
#   1. the validate_aos spoke-roadmap linter (validates spoke _aos/roadmap.yaml
#      WP entries against the canon vocabularies below), AND
#   2. the l0_project_io read-model projection remap (remaps non-canon spoke
#      vocabularies → canon at the projection boundary, leaving spoke files
#      untouched — ADR034 R9 preserved).
#
# Prose companion (authoritative narrative): WP_DB_CANONICAL_TRACK_LOD_v1.0.0.md
# Track canon: governance/directives/ADR044_AOS_v4_0_0_CHARTER_AND_TRACK_MODEL_v1.0.0.md
# Read-model projection contract: governance/directives/ADR034_ADDENDUM_R12_SPOKE_WP_READ_MODEL_PROJECTION_v1.0.0.md
#
# NOTE on field naming: the hub work_packages table stores the LOD target in the
# column `lod_status` (see WP_DB_CANONICAL_TRACK_LOD_v1.0.0.md). The logical
# field is named `lod_target` here and aliased to the `lod` key spokes commonly
# author. The `lod`/`lod_target`/`lod_status` triple all carry the same canon
# vocabulary defined under `lod_target` below.
# ---------------------------------------------------------------------------
version: 1.0.0
description: >-
  Canonical Work Package field vocabularies (status, track, lod_target) plus the
  required-field set and the spoke->canon remap table. Referenced by the
  validate_aos spoke-roadmap linter and by the l0_project_io read-model
  projection remap. Spoke roadmap files are never rewritten; remaps apply only at
  the projection boundary into the read-only work_packages rows.

# --- Canonical value sets -------------------------------------------------
status:
  # DB CHECK constraint: chk_wp_status
  constraint: chk_wp_status
  values:
    - DRAFT
    - ACTIVE
    - IN_VALIDATION
    - AWAITING_YOU
    - BLOCKED
    - CLOSED
    - ARCHIVED

track:
  # Canon: ADR044 6 tracks + HOTFIX modifier + UNCLASSIFIED sentinel.
  # UNCLASSIFIED is the projection sentinel for any non-canon spoke track value;
  # it is NOT a track a WP may be authored with — it only appears on projected
  # read-only rows whose source file declared a track outside the canon set.
  values:
    - EXPRESS
    - STANDARD
    - MANAGED
    - RESEARCH
    - OPS
    - CONTENT
    - HOTFIX
    - UNCLASSIFIED   # projection-only sentinel for non-canon spoke track values

lod_target:
  # Logical LOD field. DB column: work_packages.lod_status (see header note).
  # Also accepts the spoke-authored key `lod`.
  aliases:
    - lod
    - lod_status
  values:
    - LOD100
    - LOD200
    - LOD300
    - LOD400
    - LOD500
    - LOD500_LOCKED

# --- Required fields ------------------------------------------------------
# A WP row (authored OR projected) must carry these. `description` is NOT NULL
# at the DB layer; the projection synthesizes a placeholder when a file-SSoT WP
# omits it rather than violating the constraint.
required_fields:
  - id
  - label
  - description
  - track

# --- Spoke -> canon remap table ------------------------------------------
# Applied at the projection boundary ONLY (l0_project_io). Spoke _aos/roadmap.yaml
# files are left untouched (R9 preserved). The validate_aos linter uses the same
# table to recognize tolerated non-canon inputs and report the canon target.
# Matching is case-insensitive on the source token.
remap:
  status:
    COMPLETE: CLOSED
    COMPLETED: CLOSED
    DONE: CLOSED
    PLANNED: DRAFT
    TODO: DRAFT
    NEW: DRAFT
    BACKLOG: DRAFT
    IN_PROGRESS: ACTIVE
    WIP: ACTIVE
    REVIEW: IN_VALIDATION
    VALIDATING: IN_VALIDATION
  track:
    # Any track token not in the canon `track.values` set above projects to the
    # UNCLASSIFIED sentinel. This wildcard documents that default; specific
    # legacy aliases may be added here as they are observed.
    _default_non_canon: UNCLASSIFIED
  lod_target:
    # Any lod token not in the canon `lod_target.values` set projects to null
    # (unknown LOD is not invented at the projection boundary).
    _default_non_canon: null
